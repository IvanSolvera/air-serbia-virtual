# ==============================================================================
# Air Serbia Virtual — full stack (web + api + postgres)
# Target host: Hetzner (not yet provisioned) — see doc/deployment.md for the
# reverse-proxy/TLS layer that fronts this in production.
#
# Secrets live in a chmod-600 .env next to this file:
#   DB_PASSWORD=...
#   JWT_KEY=...      (64+ random chars: openssl rand -base64 48)
# ==============================================================================
services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: airserbiavirtua
      POSTGRES_USER: asv
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asv -d airserbiavirtua"]
      interval: 10s
      retries: 5

  # One-shot: applies pending EF migrations against the prod DB (idempotent) and
  # exits, BEFORE the API starts. Production does not auto-migrate, so this is how
  # the schema moves forward on every deploy. Reuses the api image's baked-in
  # /app/efbundle. If a migration fails it exits non-zero and the API won't start.
  migrator:
    image: asv-api:latest
    restart: "no"
    entrypoint: ["/app/efbundle", "--connection",
                 "Host=postgres;Port=5432;Database=airserbiavirtua;Username=asv;Password=${DB_PASSWORD:?set DB_PASSWORD in .env}"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: AirSerbiaVirtua.Api/Dockerfile
    image: asv-api:latest            # named so the migrator can reuse it
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      ConnectionStrings__Default: Host=postgres;Port=5432;Database=airserbiavirtua;Username=asv;Password=${DB_PASSWORD}
      Jwt__Key: ${JWT_KEY:?set JWT_KEY in .env}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-https://airserbiavirtual.example}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      migrator:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: AirSerbiaVirtua.Web/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:8080
      Api__BaseUrl: http://api:5000/
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api

volumes:
  pgdata:
